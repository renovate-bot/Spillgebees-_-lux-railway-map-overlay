name: Publish Tile Image

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/publish-image.yml"
      - "charts/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "scripts/**"
      - "styles/**"
      - "tiles/**"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Skip cache and download fresh data from Geofabrik and Overpass"
        type: boolean
        default: false
  schedule:
    # monthly rebuild (1st of the month, 03:23 UTC) to pick up OSM data updates.
    # Setting both day-of-month and day-of-week would run on either match.
    - cron: "23 3 1 * *"

# Queue publishes instead of cancelling them: a half-finished run could leave
# an image tag without its chart.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/spillgebees/lux-railway-map-overlay
  CHART_REGISTRY: oci://ghcr.io/spillgebees/charts
  CHART_PATH: charts/lux-railway-map-overlay
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1

jobs:
  image:
    name: Generate, Build, and Publish Image
    runs-on: ubuntu-latest
    if: github.repository == 'Spillgebees/lux-railway-map-overlay'
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push the image
      id-token: write # sign the provenance attestation (Sigstore OIDC)
      attestations: write # store the attestation
      artifact-metadata: write # create the attestation storage record
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version: <year>.<month*100+day>.<run number>, e.g. 2026.1003.76.
      # Valid SemVer without leading zeros, sortable, unique per run, and free
      # of "+" so it also works as an OCI chart tag.
      - name: Compute release version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          year=$(date -u +%Y)
          monthday=$((10#$(date -u +%m%d)))
          version="${year}.${monthday}.${RUN_NUMBER}"
          if [[ ! "$version" =~ ^[1-9][0-9]*\.[1-9][0-9]*\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Computed version '$version' is not valid SemVer"
            exit 1
          fi
          # Re-running every job of a run reuses its run number. Refuse to
          # overwrite a published tag; dispatch a new run instead.
          if output=$(docker buildx imagetools inspect "${IMAGE}:${version}" 2>&1); then
            echo "::error::${IMAGE}:${version} already exists. Start a new run instead of re-running this one."
            exit 1
          elif ! grep -qi "not found" <<<"$output"; then
            echo "$output"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Compute cache key
        if: ${{ !inputs.fresh }}
        id: cache-key
        run: |
          echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore generator cache
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            data/cache/overpass/
            data/intermediate/sources/
          key: pipeline-${{ steps.cache-key.outputs.month }}-${{ hashFiles('scripts/generator/pipeline_sources.py', 'scripts/generator/pipeline.py', 'scripts/generator/config.py', 'scripts/generator/routes.py') }}
          restore-keys: |
            pipeline-${{ steps.cache-key.outputs.month }}-

      - name: Build generator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./scripts/Dockerfile
          load: true
          push: false
          tags: lux-railway-generator:ci
          cache-from: type=gha,scope=generator
          cache-to: type=gha,scope=generator,mode=max

      - name: Generate MBTiles
        run: |
          mkdir -p data
          # run as the runner user so the restored cache and outputs stay writable
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/data:/data" \
            lux-railway-generator:ci \
            --countries lu,be,de,fr

      - name: Save generator cache
        if: ${{ !inputs.fresh }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            data/cache/overpass/
            data/intermediate/sources/
          key: pipeline-${{ steps.cache-key.outputs.month }}-${{ hashFiles('scripts/generator/pipeline_sources.py', 'scripts/generator/pipeline.py', 'scripts/generator/config.py', 'scripts/generator/routes.py') }}

      - name: Verify route layers were generated
        run: |
          python3 -c "
          import json, sys
          for path in sys.argv[1:]:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              features = data.get('features', [])
              if not features:
                  print(f'FAIL: {path} has no features')
                  sys.exit(1)
              print(f'OK: {path} has {len(features)} feature(s)')
          " data/intermediate/geojson/rail_routes.geojson \
            data/intermediate/geojson/rail_routes_display.geojson

      - name: Prepare production bundle
        run: |
          test -f data/out/lux-railway-map-overlay.mbtiles
          mkdir -p bundle
          cp data/out/lux-railway-map-overlay.mbtiles bundle/lux-railway-map-overlay.mbtiles

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},priority=1000
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push runtime image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: tiles/Dockerfile
          target: bundle
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # tiles/Dockerfile looks up Martin's release digest through the
          # GitHub API. The token avoids the unauthenticated rate limit.
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha,scope=tiles
          cache-to: type=gha,scope=tiles,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chart:
    name: Package and Publish Helm Chart
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the chart
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Chart.yaml in git keeps 0.0.0 placeholders. The published chart gets
      # the release version as both version and appVersion, so its default
      # image.tag points at the image pushed by the image job.
      - name: Package chart
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          helm lint "$CHART_PATH" --set image.tag="$VERSION"
          helm package "$CHART_PATH" \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Push chart to GHCR
        env:
          VERSION: ${{ needs.image.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "dist/lux-railway-map-overlay-${VERSION}.tgz" "$CHART_REGISTRY"
          helm registry logout ghcr.io

  deploy:
    name: Trigger Coolify Deployment
    runs-on: ubuntu-latest
    needs: image
    # the Coolify secrets live in this environment, which only `main` can use.
    environment: coolify
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Coolify secrets not set, skipping deployment trigger"
            exit 0
          fi
          response=$(curl -s -X POST -w "\n%{http_code}" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK")
          http_code=$(echo "$response" | tail -1)
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::warning::Coolify deployment trigger failed with HTTP $http_code"
            exit 1
          fi
          echo "Deployment triggered successfully"
