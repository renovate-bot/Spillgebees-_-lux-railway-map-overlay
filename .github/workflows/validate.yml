name: Validate

permissions: {}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  # renovate: datasource=npm depName=@maplibre/maplibre-gl-style-spec
  STYLE_SPEC_VERSION: 26.5.0
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.198.2
  # keep in step with the ghcr.io/astral-sh/uv stage in scripts/Dockerfile
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.6

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files through the API

    # workflow_dispatch runs every check
    outputs:
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflows == 'true' }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
      viewer: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.viewer == 'true' }}
      docker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
      style: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.style == 'true' }}
      biome: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.biome == 'true' }}
      helm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.helm == 'true' }}
      shell: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.shell == 'true' }}
      renovate: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.renovate == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            python:
              - 'scripts/**'
              - 'tests/**'
              - 'tiles/entrypoint.sh'
              # files the style contract tests read
              - 'styles/**'
              - 'docs/**'
              - 'viewer/**'
              - '.vscode/**'
              - 'README.md'
              - '.github/workflows/publish-image.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - '.github/workflows/validate.yml'
            viewer:
              - 'viewer/**'
              - 'global.json'
              - '.csharpierrc.yaml'
              - '.config/dotnet-tools.json'
              - '.editorconfig'
              - '.github/workflows/validate.yml'
            docker:
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**'
              - 'styles/**'
              - 'tiles/**'
              - '.github/workflows/validate.yml'
              - '.github/workflows/publish-image.yml'
            style:
              - 'styles/**'
              - '.github/workflows/validate.yml'
            biome:
              - 'biome.json'
              - '**/*.json'
              - '**/*.jsonc'
              - '**/*.css'
              - '**/*.js'
              - '**/*.ts'
              - '.github/workflows/validate.yml'
            helm:
              - 'charts/**'
              - '.github/workflows/validate.yml'
            shell:
              - '**/*.sh'
              - '.github/workflows/validate.yml'
            renovate:
              - 'renovate.json'
              - '.github/workflows/validate.yml'

  github-actions:
    name: GitHub Actions Validation
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  python:
    name: Python Lint, Types, and Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate pre-commit config
        run: uv run pre-commit validate-config .pre-commit-config.yaml

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type-check
        run: uv run basedpyright

      - name: Run unit tests
        run: uv run pytest

  viewer:
    name: Viewer Build and Formatting
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Check C# formatting
        run: dotnet csharpier check viewer

      - name: Build viewer
        run: dotnet build viewer/RailwayViewer.slnx --configuration Release -warnaserror

  docker:
    name: Dockerfile Build Validation
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Compose file
        run: docker compose --profile generate config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build generator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./scripts/Dockerfile
          push: false
          load: false
          # mode=max caches the tippecanoe builder stage too
          cache-from: type=gha,scope=generator
          cache-to: type=gha,scope=generator,mode=max

      - name: Build tiles image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./tiles/Dockerfile
          target: runtime
          push: false
          load: false
          # avoids GitHub API rate limits when the Dockerfile looks up Martin's release digest
          secrets: |
            github_token=${{ github.token }}
          # mode=max caches the font-maker glyphs stage too
          cache-from: type=gha,scope=tiles
          cache-to: type=gha,scope=tiles,mode=max

  style:
    name: MapLibre Style Validation
    needs: changes
    if: needs.changes.outputs.style == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Validate style.json against the MapLibre style spec
        run: npx --yes --package "@maplibre/maplibre-gl-style-spec@${STYLE_SPEC_VERSION}" gl-style-validate styles/style.json

  biome:
    name: Biome Check
    needs: changes
    if: needs.changes.outputs.biome == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      # Use the Biome version from the biome.json $schema URL, which Renovate keeps current.
      - name: Run Biome
        run: |
          version="$(jq -r '."$schema"' biome.json | sed -E 's#^.*/schemas/([^/]+)/schema\.json$#\1#')"
          echo "Using Biome ${version}"
          npx --yes "@biomejs/biome@${version}" ci .

  helm:
    name: Helm Chart Validation
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CHART: charts/lux-railway-map-overlay

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Chart.yaml keeps the 0.0.0 placeholder until publish-image.yml packages it,
      # so CI sets a stand-in tag. Renders default values plus every ci/*-values.yaml
      # scenario, and checks the placeholder guard still rejects an unset tag.
      - name: Lint and render chart
        run: |
          mkdir -p rendered
          if helm template ci "$CHART" > /dev/null 2>&1; then
            echo "::error::rendering without image.tag should fail on the 0.0.0 placeholder"
            exit 1
          fi
          helm lint --strict "$CHART" --set image.tag=ci
          helm template ci "$CHART" --set image.tag=ci > rendered/default.yaml
          for values in "$CHART"/ci/*-values.yaml; do
            name="$(basename "$values" -values.yaml)"
            helm lint --strict "$CHART" --set image.tag=ci --values "$values"
            helm template ci "$CHART" --set image.tag=ci --values "$values" > "rendered/${name}.yaml"
          done
          # kubeconform accepts an Ingress without TLS, so check the cert-manager default block explicitly
          if ! grep -q '^  tls:$' <(helm template ci "$CHART" --set image.tag=ci --values "$CHART/ci/cert-manager-values.yaml" --show-only templates/ingress.yaml); then
            echo "::error::cert-manager scenario rendered an Ingress without spec.tls"
            exit 1
          fi

      - name: Validate rendered manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          args: -strict -summary rendered

  shell:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: List tracked shell scripts
        id: scripts
        run: echo "files=$(git ls-files '*.sh' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Run ShellCheck on tracked shell scripts
        if: steps.scripts.outputs.files != ''
        uses: docker://koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
        with:
          args: ${{ steps.scripts.outputs.files }}

  renovate:
    name: Renovate Config Validation
    needs: changes
    if: needs.changes.outputs.renovate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Validate renovate.json
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict

  # Single required status check. Skipped jobs count as passed.
  validate:
    name: Validate
    needs:
      - changes
      - github-actions
      - python
      - viewer
      - docker
      - style
      - biome
      - helm
      - shell
      - renovate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::One or more validation jobs failed or were cancelled."
            exit 1
          fi
          echo "All validation jobs passed or were skipped."
